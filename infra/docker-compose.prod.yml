# Production stack for a single EC2 micro VM (API + Postgres).
# Usage (on the host):
#   docker compose -f infra/docker-compose.prod.yml --env-file /etc/dealeriq/prod.env up -d --build
#
# Durability (ADR-026): Postgres data is bind-mounted onto a dedicated EBS volume
# (DeleteOnTermination=false) at ${DEALERIQ_DATA_ROOT:-/var/lib/dealeriq}/pgdata.
# Local/CI keep using infra/docker-compose.yml alone (named volumes + mailhog).
#
# Prerequisites: mount point exists with an empty pgdata/ subdir
# (see docs/runbooks/durability.md).

name: dealeriq-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dealeriq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dealeriq}
    volumes:
      - ${DEALERIQ_DATA_ROOT:-/var/lib/dealeriq}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dealeriq} -d ${POSTGRES_DB:-dealeriq}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host — only reachable on the compose network.

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: dealeriq-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dealeriq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dealeriq}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_KEY_ID: ${JWT_KEY_ID:-prod-1}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-dealeriq_refresh}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@dealeriq.dev}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      ORDER_APPROVAL_DISCOUNT_THRESHOLD: ${ORDER_APPROVAL_DISCOUNT_THRESHOLD:-0.05}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-alerts@dealeriq.dev}
      DEFAULT_MONTHLY_SALES_TARGET: ${DEFAULT_MONTHLY_SALES_TARGET:-150000.0}
