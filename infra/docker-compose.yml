name: dealeriq

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dealeriq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealeriq}
      POSTGRES_DB: ${POSTGRES_DB:-dealeriq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealeriq} -d ${POSTGRES_DB:-dealeriq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
