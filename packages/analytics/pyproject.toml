[project]
name = "dealeriq-analytics"
version = "0.1.0"
description = "DealerIQ analytics library: forecasting, inventory intelligence, anomaly detection, customer analytics, benchmark harness."
authors = [{ name = "Ahmed Elshazly" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "statsforecast>=1.7",
    "lifelines>=0.29",
    "pyarrow>=17.0",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealeriq_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
