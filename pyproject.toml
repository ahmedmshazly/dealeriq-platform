[project]
name = "dealeriq"
version = "0.1.0"
description = "DealerIQ workspace root (uv workspace) — see docs/adr/015-python-packaging.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/api", "packages/analytics"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src", "packages/analytics/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework's own required idiom
# for dependency injection, not the mutable-default-argument bug this rule otherwise catches.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api/src:packages/analytics/src"

[[tool.mypy.overrides]]
# statsmodels ships no py.typed marker / type stubs (ADR-018 narrows it to STL usage only).
module = "statsmodels.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# statsforecast (ADR-005/018) and pandas ship no type stubs either.
module = ["statsforecast.*", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# lifelines (ADR-017) and scipy ship no py.typed marker / type stubs either.
module = ["lifelines.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# apscheduler (ADR-004) ships no py.typed marker / type stubs either.
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scikit-learn (ADR-023) ships no py.typed marker / type stubs either.
module = "sklearn.*"
ignore_missing_imports = true
